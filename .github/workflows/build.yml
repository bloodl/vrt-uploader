# Tests on Linux (the bundle), the exe on Windows, and on a version tag the signed release: the unsigned exe goes
# to SignPath Foundation as a GitHub artifact, comes back signed, and is attached to the release with the script
# and the sums (recomputed after signing — signing changes the exe). The release job only runs once SignPath has
# accepted the project and the organisation id is set as a repository variable.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (Linux, bundle only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: build the exe (Windows)
    runs-on: windows-latest
    needs: test
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: what the file says about itself
        shell: pwsh
        run: |
          $v = (Get-Item dist/vrt-uploader.exe).VersionInfo
          "$($v.CompanyName) | $($v.ProductName) | $($v.FileDescription) | $($v.FileVersion) | $($v.OriginalFilename)"
          "signature before SignPath: " + (Get-AuthenticodeSignature dist/vrt-uploader.exe).Status
          Get-Content dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: vrt-uploader-unsigned
          path: |
            dist/vrt-uploader.exe
            dist/vrt-uploader.cjs
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: sign (SignPath Foundation) and release
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: submit to SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: vrt-uploader
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: sums after signing
        run: |
          cd signed
          ls -la
          sha256sum vrt-uploader.exe vrt-uploader.cjs > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            signed/vrt-uploader.exe
            signed/vrt-uploader.cjs
            signed/SHA256SUMS
          generate_release_notes: true
